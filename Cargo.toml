[package]
name = "pxxxstore"
version = "0.1.0"
edition = "2024"
authors = ["matkumatmat <https://github.com/matkumatmat>"]

[dependencies]
clap = { version = "4.6", features = ["derive"] }
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
rand = "0.8"
anyhow = "1.0"
rpassword = "7.3"
zeroize = "1.8"
fs = "0.0.5"
ratatui = "0.29"
crossterm = "0.28"
arboard = { version = "3.4", optional = true }

[features]
default = ["clipboard"]
clipboard = ["arboard"]
